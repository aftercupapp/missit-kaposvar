<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7A2A3A">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MissIt Kaposvár</title>
<style>
:root{
  --maroon:#7A2A3A;
  --maroon-dark:#4E1721;
  --maroon-soft:#9a4257;
  --grey:#8B8680;
  --grey-line:rgba(78,23,33,0.12);
  --ink:#2A1F20;
  --ink-soft:#6f6259;
  --turquoise:#1E9C93;
  --turquoise-dim:rgba(30,156,147,0.14);
  --amber:#C97A2B;
  --radius:20px;
  --radius-sm:14px;
  --glass:rgba(255,255,255,0.55);
  --glass-strong:rgba(255,255,255,0.72);
  --glass-border:rgba(255,255,255,0.65);
  --surface-solid:rgba(250,247,242,0.92);
  --surface-solid-2:rgba(240,228,220,0.95);
  --bg-amber:rgba(201,122,43,0.30);
  --bg-turq:rgba(30,156,147,0.26);
  --bg-maroon:rgba(122,42,58,0.28);
  --bg-base-a:#FBF8F4;
  --bg-base-b:#F2ECE4;
  --popup-bg:#FFFFFF;
  --popup-text:#241A1C;
  --navfade-tint:transparent;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Courier New",SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --maroon:#A3475C;
  --maroon-dark:#3A1017;
  --maroon-soft:#BD5C70;
  --grey-line:rgba(255,255,255,0.10);
  --ink:#F3ECE8;
  --ink-soft:#B5A6A0;
  --turquoise:#2FC0B5;
  --turquoise-dim:rgba(47,192,181,0.22);
  --amber:#E29A55;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.14);
  --surface-solid:rgba(24,17,19,0.92);
  --surface-solid-2:rgba(36,26,29,0.95);
  --bg-amber:rgba(201,122,43,0.17);
  --bg-turq:rgba(30,156,147,0.15);
  --bg-maroon:rgba(122,42,58,0.34);
  --bg-base-a:#171012;
  --bg-base-b:#0D0A0B;
  --popup-bg:#241A1C;
  --popup-text:#F3ECE8;
  --navfade-tint:rgba(13,10,11,0.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --maroon:#A3475C;
    --maroon-dark:#3A1017;
    --maroon-soft:#BD5C70;
    --grey-line:rgba(255,255,255,0.10);
    --ink:#F3ECE8;
    --ink-soft:#B5A6A0;
    --turquoise:#2FC0B5;
    --turquoise-dim:rgba(47,192,181,0.22);
    --amber:#E29A55;
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.10);
    --glass-border:rgba(255,255,255,0.14);
    --surface-solid:rgba(24,17,19,0.92);
    --surface-solid-2:rgba(36,26,29,0.95);
    --bg-amber:rgba(201,122,43,0.17);
    --bg-turq:rgba(30,156,147,0.15);
    --bg-maroon:rgba(122,42,58,0.34);
    --bg-base-a:#171012;
    --bg-base-b:#0D0A0B;
    --popup-bg:#241A1C;
    --popup-text:#F3ECE8;
    --navfade-tint:rgba(13,10,11,0.55);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%;}
html{background:var(--bg-base-b);}
/* iOS 26 WebKit regression: in standalone + black-translucent the web view ends above the physical
   screen bottom (gap ~ top safe inset). Nothing can be drawn there, so blend the app into the page colour. */
html.ios-gap{--safe-bottom:0px;}
html.ios-gap .navfade{background:linear-gradient(to bottom,transparent,var(--bg-base-b) 88%);-webkit-mask-image:none;mask-image:none;-webkit-backdrop-filter:none;backdrop-filter:none;}
html.ios-gap body{background:var(--bg-base-b);}
body{
  font-family:var(--sans);
  color:var(--ink);
  overscroll-behavior:none;
  overscroll-behavior-y:none;
  background:
    radial-gradient(ellipse 640px 480px at 8% -6%, var(--bg-amber), transparent 60%),
    radial-gradient(ellipse 640px 560px at 104% 8%, var(--bg-turq), transparent 55%),
    radial-gradient(ellipse 760px 680px at 45% 108%, var(--bg-maroon), transparent 55%),
    linear-gradient(180deg,var(--bg-base-a),var(--bg-base-b));
  background-attachment:fixed;
  transition:color .3s ease;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;
  overflow-x:hidden;
}
input, textarea{
  user-select:text!important;-webkit-user-select:text!important;-webkit-touch-callout:default!important;
}
.leaflet-container, .leaflet-container *{touch-action:auto;}
#app{
  display:flex;flex-direction:column;
  /* body is pinned to the true viewport via position:fixed;inset:0 above, so 100% here
     exactly matches the real visible area in every mode (standalone PWA, Safari tab,
     Android Chrome) — no vh/dvh unit is reliable enough on its own for the home-indicator
     safe area in installed iOS PWAs, which was leaving a gap under the bottom nav. */
  height:100%;
  max-width:560px;margin:0 auto;
  position:relative;overflow:hidden;
}

/* ---------- animations ---------- */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes popScale{0%{transform:scale(1);}45%{transform:scale(1.4);}100%{transform:scale(1);}}
@keyframes spin{to{transform:rotate(360deg);}}
.fx{animation:fadeInUp .3s cubic-bezier(.22,.9,.32,1) both;}
.spinner{
  width:18px;height:18px;border-radius:50%;border:2.5px solid var(--grey-line);
  border-top-color:var(--maroon);display:inline-block;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:8px;
}

/* ---------- glass helpers ---------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--glass-border);
  box-shadow:0 6px 24px rgba(60,20,26,0.09), inset 0 1px 0 rgba(255,255,255,0.55);
}

/* ---------- header ---------- */
.topbar{
  background:linear-gradient(165deg, rgba(122,42,58,1), rgba(78,23,33,1));
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 16px 16px;
  flex-shrink:0;
  position:relative;
  border-bottom:1px solid rgba(255,255,255,0.16);
  box-shadow:0 8px 24px rgba(60,15,22,0.16);
  transition:background .3s ease;
}
.topbar .brand{
  font-weight:800;font-size:20px;letter-spacing:0.2px;
  display:flex;align-items:center;gap:9px;
}
.topbar .sub{font-size:12.5px;opacity:0.8;margin-top:2px;font-weight:500;}
.topbar.compact{padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px;}
.headerrow{display:flex;align-items:center;gap:10px;}
.backbtn{
  width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.14);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
.backbtn:active{background:rgba(255,255,255,0.3);transform:scale(0.92);}
.backbtn svg{width:19px;height:19px;}
.headertitle{flex:1;min-width:0;}
.headertitle .name{font-weight:800;font-size:16.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.headertitle .meta{font-size:12px;opacity:0.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.starbtn{
  width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.14);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
.starbtn:active{transform:scale(0.88);}
.starbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
.starbtn.active{background:var(--turquoise);border-color:var(--turquoise);}
.starbtn.active svg{fill:currentColor;animation:popScale .35s cubic-bezier(.36,1.8,.4,1);}

/* ---------- search ---------- */
.searchwrap{padding:12px 16px 4px;flex-shrink:0;}
.searchbox{
  display:flex;align-items:center;gap:9px;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:999px;padding:11px 15px;
  box-shadow:0 3px 14px rgba(60,20,26,0.07), inset 0 1px 0 rgba(255,255,255,0.6);
  transition:background .3s ease, border-color .3s ease;
}
.searchbox input{
  border:none;outline:none;flex:1;font-size:15px;font-family:var(--sans);
  background:transparent;color:var(--ink);min-width:0;
}
.searchbox input::placeholder{color:#a89d97;}
.searchbox svg{flex-shrink:0;opacity:0.5;width:17px;height:17px;color:var(--ink-soft);}

/* ---------- search overlay ---------- */
.search-overlay{
  position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;
  background:var(--bg-base-a);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  backdrop-filter:blur(30px) saturate(180%);
  transform:translateY(-8px);opacity:0;pointer-events:none;
  transition:transform .22s cubic-bezier(.22,.9,.32,1), opacity .18s ease;
}
.search-overlay.open{transform:translateY(0);opacity:1;pointer-events:auto;}
.search-overlay-head{
  display:flex;align-items:center;gap:9px;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  flex-shrink:0;
}
.search-overlay-head .searchbox{flex:1;}
.search-overlay-close{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--glass-border);
  background:var(--glass-strong);color:var(--ink);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s ease;
}
.search-overlay-close:active{transform:scale(0.9);}
.search-overlay-close svg{width:17px;height:17px;stroke-width:2.3;}
.search-overlay-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;}
.headerbtn{
  width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.14);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
.headerbtn:active{background:rgba(255,255,255,0.3);transform:scale(0.92);}
.headerbtn svg{width:18px;height:18px;}

/* ---------- nav (floating glass bar) ---------- */
.navfade{
  position:absolute;left:0;right:0;bottom:0;height:140px;pointer-events:none;z-index:25;
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  background:var(--navfade-tint);
  -webkit-mask-image:linear-gradient(to bottom, transparent, black 60%);
  mask-image:linear-gradient(to bottom, transparent, black 60%);
  transition:background .3s ease;
}
.bottomnav{
  position:absolute;left:12px;right:12px;bottom:calc(6px + var(--safe-bottom, env(safe-area-inset-bottom)));
  display:flex;border-radius:30px;z-index:30;overflow:hidden;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  backdrop-filter:blur(26px) saturate(190%);
  border:1px solid var(--glass-border);
  box-shadow:0 10px 32px rgba(60,18,25,0.20), inset 0 1px 0 rgba(255,255,255,0.15);
  transition:background .3s ease, border-color .3s ease;
}
.navbtn{
  flex:1;border:none;background:none;padding:20px 2px;position:relative;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-family:var(--sans);cursor:pointer;
  transition:color .15s ease;
}
.navbtn .navpill{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.85);width:50px;height:44px;
  border-radius:18px;background:transparent;transition:background .2s ease, transform .2s cubic-bezier(.34,1.56,.64,1);
}
.navbtn.active .navpill{background:rgba(122,42,58,0.14);transform:translate(-50%,-50%) scale(1);}
.navbtn.active{color:var(--maroon);}
.navbtn:active svg{transform:scale(0.85);}
.navbtn .lbl{display:none;}
.navbtn svg{width:27px;height:27px;position:relative;stroke-width:2;transition:transform .15s ease;}

/* ---------- content ---------- */
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:10px 14px calc(112px + var(--safe-bottom, env(safe-area-inset-bottom)));max-width:100%;}
.content.nopad{padding:0;}
.content.noscroll{overflow:hidden;}

.section-label{
  font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:0.6px;margin:16px 4px 8px;
}
.section-label:first-child{margin-top:4px;}

/* ---------- collapsible sections ---------- */
.collapse-toggle{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:none;border:none;font-family:var(--sans);text-align:left;padding:2px 2px;
  cursor:pointer;transition:opacity .15s ease;
}
.collapse-toggle:active{opacity:0.55;}
.collapse-label{display:flex;align-items:center;}
.collapse-chev{display:flex;color:var(--ink-soft);flex-shrink:0;}
.collapse-chev svg{width:14px;height:14px;stroke-width:2.4;transition:transform .28s cubic-bezier(.34,1.56,.64,1);transform:rotate(90deg);}
.collapse-chev.closed svg{transform:rotate(0deg);}
.collapsebody{
  max-height:4000px;opacity:1;overflow:hidden;
  transition:max-height .32s cubic-bezier(.4,0,.2,1), opacity .25s ease;
}
.collapsebody.closed{max-height:0;opacity:0;}

/* ---------- nearby departures ---------- */
.nearbyprompt{padding:20px 16px 16px;text-align:center;}
.nearbyprompt .np-icon{display:flex;justify-content:center;margin-bottom:10px;color:var(--ink-soft);opacity:0.7;}
.nearbyprompt .np-icon svg{width:32px;height:32px;stroke-width:1.6;}
.nearbyprompt .np-text{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px;}
.locbtn{
  display:inline-flex;align-items:center;gap:7px;border:none;border-radius:12px;
  padding:10px 16px;font-size:13.5px;font-weight:700;font-family:var(--sans);cursor:pointer;
  background:linear-gradient(150deg,var(--maroon),var(--maroon-dark));color:#fff;
  transition:transform .12s ease;box-shadow:0 3px 10px rgba(78,23,33,0.25);
}
.locbtn svg{width:15px;height:15px;}
.locbtn:active{transform:scale(0.95);}
.locbtn.ghost{background:rgba(122,42,58,0.08);color:var(--maroon);box-shadow:none;}
.nearby-topline{display:flex;gap:8px;padding:12px 13px 4px;flex-wrap:wrap;}
.nearby-searchwrap{padding:0 13px 14px;}
.nearby-searchwrap .searchbox{padding:9px 13px;}
.nearby-searchwrap .searchbox input{font-size:13.5px;}
.nearbysuggest{margin:0 13px 12px;}
.nearbysuggest .rowbtn{padding:10px 12px;}
.nearbygroup{border-top:1px solid var(--grey-line);}
.nearbygroup:first-of-type{border-top:none;}
.nearbygroup-head{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  border:none;background:rgba(122,42,58,0.04);padding:9px 13px;cursor:pointer;
  font-family:var(--sans);text-align:left;transition:background .15s ease;
}
.nearbygroup-head:active{background:rgba(122,42,58,0.1);}
.ngh-name{font-size:13px;font-weight:700;color:var(--ink);}
.ngh-dist{font-size:11px;font-weight:700;color:var(--turquoise);flex-shrink:0;margin-left:8px;}
.nearbyempty{padding:10px 13px 12px;font-size:12.5px;color:var(--ink-soft);}
.favchiprow{padding:0 13px 10px;display:flex;flex-wrap:wrap;}

/* ---------- list items ---------- */
.card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  margin-bottom:9px;overflow:hidden;
  box-shadow:0 4px 20px rgba(60,20,26,0.07), inset 0 1px 0 rgba(255,255,255,0.55);
  transition:background .3s ease, border-color .3s ease;
}
.rowbtn{
  display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;
  padding:12px 13px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink);
  text-decoration:none;transition:transform .12s ease, background .15s ease;
}
.rowbtn:active{background:rgba(122,42,58,0.06);transform:scale(0.985);}
.rowbtn + .rowbtn{border-top:1px solid var(--grey-line);}
.rowbtn .rt{flex:1;min-width:0;}
.rowbtn .rname{font-size:15px;font-weight:700;line-height:1.3;}
.rowbtn .rsub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}
.chev{color:#c7b3ae;flex-shrink:0;display:flex;}
.chev svg{width:16px;height:16px;}

.badge{
  flex-shrink:0;min-width:38px;height:30px;padding:0 8px;border-radius:10px;
  background:linear-gradient(160deg,var(--maroon),var(--maroon-dark));color:#fff;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);
  box-shadow:0 2px 6px rgba(78,23,33,0.3);
}
.badge.sm{min-width:30px;height:24px;font-size:11.5px;border-radius:8px;padding:0 6px;}

.empty{text-align:center;padding:46px 20px;color:var(--ink-soft);}
.empty .big{display:flex;justify-content:center;margin-bottom:12px;}
.empty .big svg{width:38px;height:38px;stroke-width:1.6;color:var(--ink-soft);opacity:0.7;}
.empty .t1{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:5px;}
.empty .t2{font-size:13px;line-height:1.5;}

/* ---------- home ---------- */
.hero{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:6px;}
.herobtn{
  flex:1 1 45%;border:none;border-radius:var(--radius);padding:16px 13px;text-align:left;
  cursor:pointer;font-family:var(--sans);color:#fff;position:relative;overflow:hidden;
  box-shadow:0 6px 18px rgba(40,15,20,0.16);
}
.herobtn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.30), rgba(255,255,255,0) 55%);
  pointer-events:none;
}
.herobtn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,0.28);pointer-events:none;
}
.herobtn.a{background:linear-gradient(150deg,var(--maroon),var(--maroon-dark));}
.herobtn.b{background:linear-gradient(150deg,#2b8078,var(--turquoise));}
.herobtn.c{background:linear-gradient(150deg,#c0812f,#a8631f);}
.herobtn.d{background:linear-gradient(150deg,#5c4e51,#3d3234);}
.herobtn .hicon{position:relative;margin-bottom:8px;opacity:0.92;}
.herobtn .hicon svg{width:22px;height:22px;stroke-width:2;}
.herobtn .hl{font-size:15px;font-weight:800;position:relative;display:flex;align-items:center;gap:6px;}
.herobtn .hs{font-size:11.5px;opacity:0.85;margin-top:3px;position:relative;}
.livepulse{
  display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;
  animation:pulse 1.6s ease-in-out infinite;flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

.favchip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);border-radius:999px;padding:7px 14px 7px 10px;
  margin:0 7px 7px 0;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  transition:transform .12s ease;
}
.favchip:active{transform:scale(0.94);}
.favchip svg{width:14px;height:14px;fill:var(--amber);stroke:var(--amber);}
.favwrap{display:flex;flex-wrap:wrap;}

/* ---------- route square grid ---------- */
.routegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:7px;}
.routesq{
  aspect-ratio:1;border:1px solid rgba(255,255,255,0.28);border-radius:13px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13.5px;color:#fff;
  background:linear-gradient(150deg,var(--maroon),var(--maroon-dark));
  box-shadow:0 3px 10px rgba(78,23,33,0.20);cursor:pointer;font-family:var(--sans);
  transition:transform .12s ease;opacity:0;animation:fadeInUp .35s cubic-bezier(.22,.9,.32,1) both;
}
.routesq:active{transform:scale(0.92);}
.routesq::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.28), rgba(255,255,255,0) 55%);
  pointer-events:none;
}

/* ---------- date nav ---------- */
.datenav{
  display:flex;align-items:center;gap:6px;
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:16px;padding:6px;margin:10px 0;
  box-shadow:0 3px 14px rgba(60,20,26,0.06), inset 0 1px 0 rgba(255,255,255,0.55);
  transition:background .3s ease, border-color .3s ease;
}
.datebtn{
  border:none;background:rgba(122,42,58,0.08);color:var(--maroon);border-radius:11px;
  width:32px;height:32px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease, background .15s ease;
}
.datebtn svg{width:16px;height:16px;stroke-width:2.3;}
.datebtn:active{background:rgba(122,42,58,0.16);transform:scale(0.88);}
.datelabel{
  flex:1;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;
  padding:6px 4px;border-radius:8px;position:relative;transition:transform .12s ease;
}
.datelabel:active{transform:scale(0.97);}
.datelabel .today-tag{display:block;font-size:10.5px;font-weight:700;color:var(--turquoise);margin-top:1px;}
#datepick{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;}

/* ---------- variant tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:2px;}
.routedetailtoggle{margin-bottom:2px;}
.routemappanel{
  height:52vh;max-height:480px;min-height:320px;margin-top:10px;
  border-radius:var(--radius);position:relative;overflow:hidden;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-border);
  box-shadow:0 4px 20px rgba(60,20,26,0.07), inset 0 1px 0 rgba(255,255,255,0.55);
}
#routeMap{width:100%;height:100%;background:var(--surface-solid-2);}
.tabs::-webkit-scrollbar{display:none;}
.tabbtn{
  flex-shrink:0;border:1px solid var(--glass-border);background:var(--glass);color:var(--ink-soft);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  font-family:var(--sans);white-space:nowrap;transition:transform .12s ease, background .2s ease, color .2s ease;
}
.tabbtn:active{transform:scale(0.95);}
.tabbtn.active{background:linear-gradient(150deg,var(--maroon),var(--maroon-dark));color:#fff;border-color:transparent;}

/* ---------- grid table ---------- */
.gridwrap{
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-border);border-radius:var(--radius);margin-top:8px;
  box-shadow:0 4px 20px rgba(60,20,26,0.07), inset 0 1px 0 rgba(255,255,255,0.55);
}
table.tt{border-collapse:collapse;font-family:var(--mono);font-size:12.5px;}
table.tt th,table.tt td{padding:7px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--grey-line);}
table.tt th{
  font-family:var(--sans);font-size:10.5px;font-weight:800;color:var(--ink-soft);
  background:rgba(122,42,58,0.05);text-transform:uppercase;letter-spacing:0.3px;
}
table.tt td.stopname{
  font-family:var(--sans);font-size:12.5px;font-weight:600;text-align:left;
  position:sticky;left:0;background:var(--surface-solid);cursor:pointer;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--grey-line);
}
table.tt th.stopcol{position:sticky;left:0;background:var(--surface-solid-2);z-index:2;border-right:1px solid var(--grey-line);text-align:left;}
table.tt td.empty-cell{color:#d9cfc7;}
td.nextcell,th.nextcell{background:var(--turquoise-dim)!important;}
table.tt tr:last-child td{border-bottom:none;}

/* ---------- departures list ---------- */
.dep{display:flex;align-items:center;gap:12px;padding:11px 13px;border-bottom:1px solid var(--grey-line);}
.dep:last-child{border-bottom:none;}
.dep.past{opacity:0.4;}
.dep.next{background:var(--turquoise-dim);}
.dep .time{font-family:var(--mono);font-weight:700;font-size:16.5px;min-width:56px;}
.dep .dd{flex:1;min-width:0;}
.dep .dhead{font-size:13.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dep .depsub{font-size:11.5px;color:var(--ink-soft);opacity:0.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.livepulse.sm{width:6px;height:6px;}
.runheader{display:flex;align-items:center;gap:6px;}
.dep.rowfade{animation:fadeInUp .35s cubic-bezier(.22,.9,.32,1) both;}
.dep.rowpulse{animation:rowPulseFlash .7s ease;}
@keyframes rowPulseFlash{0%{background:var(--turquoise-dim);}100%{background:transparent;}}
.nowline{
  text-align:center;font-size:11px;font-weight:800;color:var(--turquoise);
  letter-spacing:0.4px;text-transform:uppercase;padding:6px 0;background:var(--turquoise-dim);
}

.maplink{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--maroon);
  text-decoration:none;padding:8px 0 2px;
}
.maplink svg{width:15px;height:15px;}

.mini{
  display:inline-flex;align-items:center;justify-content:center;background:rgba(122,42,58,0.09);
  color:var(--maroon);font-weight:700;font-size:10.5px;border-radius:6px;padding:3px 6px;margin:2px 3px 0 0;
  cursor:pointer;transition:transform .12s ease, background .15s ease;
}
.mini:active{transform:scale(0.9);background:rgba(122,42,58,0.18);}
.badgesub{display:flex;flex-wrap:wrap;}
.dep .badge.linkbadge{cursor:pointer;transition:transform .12s ease;}
.dep .badge.linkbadge:active{transform:scale(0.9);}

.feedinfo{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 20px 4px;line-height:1.5;}
.feedinfo a{color:var(--maroon);font-weight:700;text-decoration:none;}

/* ---------- live tracking ---------- */
.livewrap{position:relative;width:100%;height:100%;overflow:hidden;background:var(--surface-solid-2);}
.livewrap iframe{position:absolute;top:-103px;left:0;width:100%;height:calc(100% + 103px);border:none;}
.livenotice{
  display:flex;align-items:center;gap:8px;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  color:var(--ink-soft);font-size:11.5px;padding:10px 14px;border-bottom:1px solid var(--glass-border);
  position:relative;z-index:2;
}
.livenotice svg{width:15px;height:15px;flex-shrink:0;color:var(--maroon);}

/* ---------- menu ---------- */
a.rowbtn{display:flex;}
.rowicon{
  width:34px;height:34px;border-radius:11px;background:rgba(122,42,58,0.07);flex-shrink:0;color:var(--maroon);
  display:flex;align-items:center;justify-content:center;
}

.infocard{
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);

  box-shadow:0 4px 18px rgba(60,20,26,0.06), inset 0 1px 0 rgba(255,255,255,0.5);
}
.infocard b{color:var(--ink);}
.infocard a{color:var(--maroon);font-weight:700;text-decoration:none;}

/* ---------- theme switcher ---------- */

}

.specrow .st .muted{color:var(--ink-soft);font-weight:500;font-size:12.5px;display:block;margin-top:1px;}

.specrow.link:active{background:rgba(122,42,58,0.06);}

.newsitem:last-child{border-bottom:none;}

.newsitem .ntitle{font-size:14.5px;font-weight:700;line-height:1.35;margin-bottom:4px;}
.newsitem .ndesc{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.newsitem .nlink{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:700;color:var(--maroon);text-decoration:none;}
.loadingrow{padding:30px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}
.footnote{font-size:11px;color:var(--ink-soft);padding:0 13px 12px;line-height:1.5;}

.nethead.open .nettag{color:var(--turquoise);}
.nethead.locked .nettag{color:var(--maroon);}
.netdetails{padding:0 14px 13px 58px;font-size:12.5px;color:var(--ink-soft);line-height:1.9;}

.maplocatebtn{

  border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;
  color:var(--maroon);box-shadow:0 4px 14px rgba(0,0,0,0.22);cursor:pointer;transition:transform .12s ease;
}
.maplocatebtn:active{transform:scale(0.9);}
.maplocatebtn svg{width:19px;height:19px;}
#mapLoadingRow{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--surface-solid-2);z-index:15;}

<script>
"use strict";

/* ---------------- theme ---------------- */
const THEME_KEY = 'mik_theme';
function getThemePref(){
  try{ return localStorage.getItem(THEME_KEY) || 'auto'; }catch(e){ return 'auto'; }
}
function isDarkActive(){
  const pref = getThemePref();
  if(pref === 'dark') return true;
  if(pref === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const pref = getThemePref();
  if(pref === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', pref);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', isDarkActive() ? '#3A1017' : '#7A2A3A');
}
function setThemePref(pref){
  try{ localStorage.setItem(THEME_KEY, pref); }catch(e){}
  applyTheme();
}
applyTheme();
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(getThemePref()==='auto') applyTheme();
  });
}

/* ---------------- real viewport height (fixes Android pull-to-refresh resize issues) ----------------
   iOS Safari's native 100dvh unit already tracks the true visible area correctly (including
   safe areas, with no JS timing issues), so on iOS we deliberately do NOT set --app-height and
   let the CSS fall back to 100dvh. Overriding it with a JS-measured pixel value on iOS was the
   cause of the bottom nav being pushed off-screen / clipped. Android's WebView has historically
   had a resize bug with dvh on pull-to-refresh, so it keeps the JS-measured fallback. */
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
function setAppHeight(){
  const root = document.documentElement;
  if(IS_IOS && IS_STANDALONE){
    const portrait = window.innerHeight >= window.innerWidth;
    const full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    const gap = full - window.innerHeight;
    root.classList.toggle('ios-gap', gap > 8);
    return;
  }
  if(IS_IOS) return; // iOS Safari tab: native viewport
  root.style.setProperty('--app-height', window.innerHeight + 'px');
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
window.addEventListener('pageshow', setAppHeight);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setAppHeight(); });
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

const RAW = JSON.parse(document.getElementById('gtfs-data').textContent);
const ROUTES = RAW.routes;      // {id:[short,long]}
const STOPS = RAW.stops;        // {id:[name,lat,lon]}
const VARIANTS = RAW.variants;  // [{id,r,stops:[sid],head,trips:[{s,t:[time]}]}]
const SVC = RAW.svc;            // {sid:[YYYYMMDD,...]}

/* ---------------- precompute ---------------- */
const SVC_SET = {};
Object.keys(SVC).forEach(sid => SVC_SET[sid] = new Set(SVC[sid]));

let MIN_DATE = null, MAX_DATE = null;
Object.values(SVC).forEach(arr => arr.forEach(d => {
  if (!MIN_DATE || d < MIN_DATE) MIN_DATE = d;
  if (!MAX_DATE || d > MAX_DATE) MAX_DATE = d;
}));

const VARIANTS_BY_ROUTE = {};
const VARIANTS_BY_STOP = {}; // sid -> [{v, idx}]
VARIANTS.forEach(v => {
  (VARIANTS_BY_ROUTE[v.r] = VARIANTS_BY_ROUTE[v.r] || []).push(v);
  v.stops.forEach((sid, idx) => {
    (VARIANTS_BY_STOP[sid] = VARIANTS_BY_STOP[sid] || []).push({v, idx});
  });
});
const VARIANT_INDEX_IN_ROUTE = {}; // variant.id -> index within VARIANTS_BY_ROUTE[variant.r]
Object.keys(VARIANTS_BY_ROUTE).forEach(rid=>{
  VARIANTS_BY_ROUTE[rid].forEach((v,i)=>{ VARIANT_INDEX_IN_ROUTE[v.id] = i; });
});
function haversineMetersStatic(lat1,lon1,lat2,lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
VARIANTS.forEach(v=>{
  if(v.shapePts && v.shapePts.length){
    const cum = [0];
    for(let i=1;i<v.shapePts.length;i++){
      cum.push(cum[i-1] + haversineMetersStatic(v.shapePts[i-1][0],v.shapePts[i-1][1], v.shapePts[i][0],v.shapePts[i][1]));
    }
    v.shapeCumDist = cum;
  }
});
function pointAlongShape(v, targetDist){
  const pts = v.shapePts, cum = v.shapeCumDist;
  if(targetDist <= cum[0]) return pts[0];
  const last = cum.length-1;
  if(targetDist >= cum[last]) return pts[last];
  for(let i=1;i<cum.length;i++){
    if(targetDist <= cum[i]){
      const segLen = cum[i]-cum[i-1];
      const f = segLen>0 ? (targetDist-cum[i-1])/segLen : 0;
      return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];
    }
  }
  return pts[last];
}

const STOPS_BY_NAME = {}; // name -> [sid,...]
Object.keys(STOPS).forEach(sid => {
  const name = STOPS[sid][0];
  (STOPS_BY_NAME[name] = STOPS_BY_NAME[name] || []).push(sid);
});
const ALL_STOP_NAMES = Object.keys(STOPS_BY_NAME).sort((a,b)=>a.localeCompare(b,'hu'));

const ROUTE_LIST = Object.keys(ROUTES).map(id => ({id, short: ROUTES[id][0], long: ROUTES[id][1]}));
ROUTE_LIST.sort((a,b) => {
  const na = parseInt(a.short), nb = parseInt(b.short);
  if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return a.short.localeCompare(b.short,'hu');
});

function routesServingStop(sid){
  const set = new Set();
  (VARIANTS_BY_STOP[sid]||[]).forEach(e => set.add(ROUTES[e.v.r][0]));
  return Array.from(set).sort((a,b)=>{
    const na=parseInt(a), nb=parseInt(b);
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
    return a.localeCompare(b,'hu');
  });
}
function routeBadgesForStop(sid){
  const seen = new Set(); const out = [];
  (VARIANTS_BY_STOP[sid]||[]).forEach(e=>{
    const rid = e.v.r;
    if(!seen.has(rid)){ seen.add(rid); out.push({id: rid, short: ROUTES[rid][0]}); }
  });
  out.sort((a,b)=>{
    const na=parseInt(a.short), nb=parseInt(b.short);
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
    return a.short.localeCompare(b.short,'hu');
  });
  return out;
}

/* ---------- nearby departures: distance + state helpers ---------- */
function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDistance(m){
  if(m < 1000) return Math.round(m/10)*10 + ' m';
  return (m/1000).toFixed(1).replace('.', ',') + ' km';
}
function getNearbyRef(){
  try{ return JSON.parse(localStorage.getItem('mik_nearby_ref')||'null'); }catch(e){ return null; }
}
function setNearbyRef(ref){

}
function clearNearbyRef(){

function nearbyRefCoords(ref){
  if(!ref) return null;
  if(ref.type==='geo') return {lat: ref.lat, lon: ref.lon};
  if(ref.type==='stop' && STOPS[ref.stopId]) return {lat: STOPS[ref.stopId][1], lon: STOPS[ref.stopId][2]};
  return null;
}
function nearestStops(lat, lon, limit){
  const list = Object.keys(STOPS).map(sid=>{
    const s = STOPS[sid];
    return {sid, name: s[0], dist: haversineMeters(lat, lon, s[1], s[2])};
  });
  list.sort((a,b)=>a.dist-b.dist);
  return list.slice(0, limit);
}
function upcomingDeparturesForStop(sid, limit){
  const todayYMD = toYMD(new Date());
  const active = new Set(activeServicesForDate(todayYMD));
  const now = nowTimeStr();
  const entries = VARIANTS_BY_STOP[sid] || [];
  let deps = [];
  entries.forEach(({v, idx})=>{
    v.trips.forEach(t=>{
      if(active.has(t.s) && t.t[idx] && t.t[idx] >= now){
        deps.push({time: t.t[idx], routeId: v.r, route: ROUTES[v.r][0], head: v.head});
      }
    });
  });
  deps.sort((a,b)=> a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
  return deps.slice(0, limit);
}

function getCurrentlyRunningTrips(){
  const now = nowTimeStr();
  const active = new Set(activeServicesForDate(toYMD(new Date())));
  const running = [];
  VARIANTS.forEach(v=>{
    v.trips.forEach((t, ti)=>{
      if(!active.has(t.s)) return;
      const first = t.t[0], last = t.t[t.t.length-1];
      if(now < first || now > last) return;
      let idx = t.t.length-1;
      for(let i=0;i<t.t.length-1;i++){
        if(now >= t.t[i] && now < t.t[i+1]){ idx = i; break; }
      }
      const nextIdx = Math.min(idx+1, v.stops.length-1);
      running.push({
        key: v.id+'_'+ti,
        routeId: v.r,
        route: ROUTES[v.r][0],
        head: v.head,
        nextStop: STOPS[v.stops[nextIdx]][0],
        nextTime: t.t[nextIdx]
      });
    });
  });
  running.sort((a,b)=>{
    const na=parseInt(a.route), nb=parseInt(b.route);
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
    return a.route.localeCompare(b.route,'hu');
  });
  return running;
}

function norm(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function pad2(n){ return n<10 ? '0'+n : ''+n; }
function toYMD(d){ return ''+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function ymdToDate(ymd){ return new Date(parseInt(ymd.slice(0,4)), parseInt(ymd.slice(4,6))-1, parseInt(ymd.slice(6,8))); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }

const MO = ['jan.','febr.','márc.','ápr.','máj.','jún.','júl.','aug.','szept.','okt.','nov.','dec.'];
function fmtDateLong(d){ return d.getFullYear()+'. '+MO[d.getMonth()]+' '+d.getDate()+'., '+WD[d.getDay()]; }
function nowTimeStr(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }

function getCollapseState(){

function collapseHeaderHtml(key, label, live){

function wireCollapseToggles(root){

      setSectionCollapsed(key, nowCollapsed);

      if(body) body.classList.toggle('closed', nowCollapsed);
      if(chev) chev.classList.toggle('closed', nowCollapsed);

/* ---- running-trips card: build, wire, animate, auto-refresh ---- */
function buildRunningRows(){
  return getCurrentlyRunningTrips().slice(0,25);
}
function runningRowNode(r){
  const node = el(`<div class="dep" data-key="${escAttr(r.key)}">
    <div class="time">${esc(r.nextTime.slice(0,5))}</div>
    <div class="badge sm linkbadge" data-route="${r.routeId}">${esc(r.route)}</div>
    <div class="dd"><div class="dhead">→ ${esc(r.head)}</div><div class="depsub">Köv. megálló: ${esc(r.nextStop)}</div></div>
  </div>`);
  node.querySelector('[data-route]').onclick = ()=>openRoute(r.routeId);
  return node;
}
function wireRunningLiveBtn(runcard){
  const liveHomeBtn = runcard.querySelector('[data-nav-live-home]');
  if(liveHomeBtn) liveHomeBtn.onclick = ()=>go('live');
}
function renderRunningCard(){
  const runcard = document.getElementById('runcard');
  if(!runcard) return;
  const rows = buildRunningRows();

  if(!rows.length){
    runcard.innerHTML = `<div class="specrow"><div class="st" style="font-size:13px;color:var(--ink-soft);font-weight:500;">Jelenleg egy járat sem közlekedik a menetrend szerint.</div></div>` +
      menuNavHtml('radio','Élő adatok megnyitása','Hivatalos webes követés','data-nav-live-home="1"');
    wireRunningLiveBtn(runcard);
    return;
  }

  let liveBtn = runcard.querySelector('[data-nav-live-home]');
  const existing = {};
  runcard.querySelectorAll('.dep[data-key]').forEach(n=>{ existing[n.dataset.key] = n; });
  runcard.querySelectorAll('.specrow').forEach(n=>n.remove());

  let newCount = 0;
  rows.forEach(r=>{
    const newTime = r.nextTime.slice(0,5);
    const newSub = 'Köv. megálló: '+r.nextStop;
    let node = existing[r.key];
    if(node){
      const timeEl = node.querySelector('.time');
      const subEl = node.querySelector('.depsub');
      if(timeEl.textContent !== newTime || subEl.textContent !== newSub){
        timeEl.textContent = newTime;
        subEl.textContent = newSub;
        node.classList.remove('rowpulse'); void node.offsetWidth; node.classList.add('rowpulse');
      }
      delete existing[r.key];
    } else {
      node = runningRowNode(r);
      node.classList.add('rowfade');
      node.style.animationDelay = Math.min(newCount*30, 240)+'ms';
      newCount++;
    }
    if(liveBtn) runcard.insertBefore(node, liveBtn);
    else runcard.appendChild(node);
  });

  Object.values(existing).forEach(n=>n.remove());

  if(!liveBtn){
    runcard.insertAdjacentHTML('beforeend', menuNavHtml('radio','Élő adatok megnyitása','Hivatalos webes követés','data-nav-live-home="1"'));
    liveBtn = runcard.querySelector('[data-nav-live-home]');
  }
  liveBtn.onclick = ()=>go('live');
}
let RUNNING_TIMER = null;
function stopRunningRefresh(){
  if(RUNNING_TIMER){ clearInterval(RUNNING_TIMER); RUNNING_TIMER = null; }
}
function startRunningRefresh(){
  stopRunningRefresh();
  RUNNING_TIMER = setInterval(()=>{
    if(state.view !== 'routes' || isSectionCollapsed('running')){ stopRunningRefresh(); return; }
    renderRunningCard();
  }, 20000);
}

function wireNearbyIdle(card){
  const locateBtn = card.querySelector('#nearby-locate');
  if(locateBtn) locateBtn.onclick = requestGeoLocation;

  const input = card.querySelector('#nearbysearch');
  const suggest = card.querySelector('#nearbySuggest');
  if(input){
    input.oninput = ()=>{
      const q = norm(input.value.trim());
      if(!q){ suggest.innerHTML=''; return; }
      const matches = ALL_STOP_NAMES.filter(n=>norm(n).includes(q)).slice(0,6);
      if(!matches.length){ suggest.innerHTML = `<div class="nearbyempty">Nincs találat.</div>`; return; }
      suggest.innerHTML = `<div class="card nearbysuggest">` + matches.map(n=>
        rowBtnHtml('', n, routesServingStop(STOPS_BY_NAME[n][0]).slice(0,4).join(', '), `data-pickstop="${escAttr(n)}"`)
      ).join('') + `</div>`;
      suggest.querySelectorAll('[data-pickstop]').forEach(b=>b.onclick=()=>{
        const ids = STOPS_BY_NAME[b.dataset.pickstop];
        setNearbyRef({type:'stop', stopId: ids[0]});
        renderNearbyCard();
      });
    };
  }
  card.querySelectorAll('#nearbyFavRow [data-stopid]').forEach(chip=>{
    chip.onclick = ()=>{
      setNearbyRef({type:'stop', stopId: chip.dataset.stopid});
      renderNearbyCard();
    };
  });
}
function requestGeoLocation(){
  const card = document.getElementById('nearbycard');
  if(!card) return;
  if(!navigator.geolocation){
    card.innerHTML = emptyHtml('mapPin','A helymeghatározás nem elérhető','A böngésződ nem támogatja. Válassz egy megállót kézzel.') + nearbySearchOnlyHtml();
    wireNearbyIdle(card);
    return;
  }
  card.innerHTML = `<div class="loadingrow"><span class="spinner"></span>Helyzet meghatározása…</div>`;
  navigator.geolocation.getCurrentPosition(
    pos=>{
      setNearbyRef({type:'geo', lat: pos.coords.latitude, lon: pos.coords.longitude});
      renderNearbyCard();
    },
    ()=>{
      card.innerHTML = emptyHtml('mapPin','Nem sikerült meghatározni a helyzeted','Ellenőrizd a helymeghatározási engedélyt, vagy válassz egy megállót kézzel.') + nearbySearchOnlyHtml();
      wireNearbyIdle(card);
    },
    {enableHighAccuracy:false, timeout:8000, maximumAge:60000}
  );
}

/* ---- route map (single-route shape + stops + estimated positions) ---- */
let RMAP = null, RMAP_VEHLAYER = null, RMAP_TIMER = null;
let rmapVehicleMarkers = {};
function destroyRouteMap(){
  if(RMAP_TIMER){ clearInterval(RMAP_TIMER); RMAP_TIMER = null; }
  if(RMAP){ RMAP.remove(); RMAP = null; RMAP_VEHLAYER = null; }
  rmapVehicleMarkers = {};
}
function initRouteMap(v){
  ensureLeaflet(()=>{
    const container = document.getElementById('routeMap');
    if(!container) return;
    const map = L.map('routeMap', {zoomControl:true, attributionControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'© OpenStreetMap közreműködők'
    }).addTo(map);

    let bounds = [];
    if(v.shapePts && v.shapePts.length){
      L.polyline(v.shapePts, {color:'#7A2A3A', weight:4, opacity:0.75}).addTo(map);
      bounds = v.shapePts.slice();
    }
    v.stops.forEach((sid, idx)=>{
      const s = STOPS[sid];
      const m = L.circleMarker([s[1], s[2]], {radius:6, color:'#2B6FD4', weight:2, fillColor:'#2B6FD4', fillOpacity:0.85}).addTo(map);
      m.bindPopup(`<div class="mappopup"><b>${idx+1}. ${esc(s[0])}</b><br><a href="#" data-popup-stop="${sid}">Megállólap megnyitása →</a></div>`);
      m.on('popupopen', (e)=>{
        const el = e.popup.getElement().querySelector('[data-popup-stop]');
        if(el) el.onclick = (ev)=>{ ev.preventDefault(); openStopDetail(sid); };
      });
      if(!bounds.length) bounds.push([s[1], s[2]]);
    });
    if(bounds.length) map.fitBounds(bounds, {padding:[22,22]});
    else map.setView([46.3597,17.7963], 13);

    const vehLayer = L.layerGroup().addTo(map);
    RMAP = map; RMAP_VEHLAYER = vehLayer;
    const loadingRow = document.getElementById('routeMapLoadingRow');
    if(loadingRow) loadingRow.remove();
    refreshRouteVehicleMarkers(v);
    RMAP_TIMER = setInterval(()=>{
      if(state.view !== 'routeDetail' || getRouteDetailViewPref() !== 'map'){ destroyRouteMap(); return; }
      refreshRouteVehicleMarkers(v);
    }, 15000);
  }, ()=>{
    const wrap = document.getElementById('routeMapWrap');
    if(wrap) wrap.innerHTML = emptyHtml('cloudOff','A térkép nem tölthető be','Ellenőrizd az internetkapcsolatot, és próbáld újra.');
  });
}
function refreshRouteVehicleMarkers(v){
  if(!RMAP_VEHLAYER) return;
  const now = nowTimeStr();
  const nowSec = timeToSec(now);
  const active = new Set(activeServicesForDate(toYMD(new Date())));
  const route = ROUTES[v.r][0];
  const seenKeys = new Set();
  v.trips.forEach((t, ti)=>{
    if(!active.has(t.s)) return;
    const first = t.t[0], last = t.t[t.t.length-1];
    if(now < first || now > last) return;
    let idx = t.t.length-1;
    for(let i=0;i<t.t.length-1;i++){ if(now >= t.t[i] && now < t.t[i+1]){ idx = i; break; } }
    const nextIdx = Math.min(idx+1, v.stops.length-1);
    const startSec = timeToSec(t.t[idx]), endSec = timeToSec(t.t[nextIdx]);
    const frac = endSec>startSec ? Math.min(1, Math.max(0, (nowSec-startSec)/(endSec-startSec))) : 0;
    let lat, lon;
    if(v.shapePts && v.stopDist){
      const d1 = v.stopDist[idx], d2 = v.stopDist[nextIdx];
      const pos = pointAlongShape(v, d1 + (d2-d1)*frac);
      lat = pos[0]; lon = pos[1];
    }else{
      const s1 = STOPS[v.stops[idx]], s2 = STOPS[v.stops[nextIdx]];
      lat = lerp(s1[1], s2[1], frac); lon = lerp(s1[2], s2[2], frac);
    }
    const key = v.id+'_'+ti;
    seenKeys.add(key);
    let marker = rmapVehicleMarkers[key];
    if(marker){
      marker.setLatLng([lat, lon]);
    }else{
      const icon = L.divIcon({className:'', html:`<div class="vehiclepin">${esc(route)}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
      marker = L.marker([lat, lon], {icon}).addTo(RMAP_VEHLAYER);
      rmapVehicleMarkers[key] = marker;
    }
    marker.bindPopup(`<div class="mappopup"><b>${esc(route)}</b> → ${esc(v.head)}<br><span class="mp-sub">Becsült pozíció · köv. megálló: ${esc(STOPS[v.stops[nextIdx]][0])} (${esc(t.t[nextIdx].slice(0,5))})</span><br><span class="mp-note">${ICO.info} Ez nem élő adat, csak menetrendi információ.</span></div>`);
  });
  Object.keys(rmapVehicleMarkers).forEach(k=>{
    if(!seenKeys.has(k)){ RMAP_VEHLAYER.removeLayer(rmapVehicleMarkers[k]); delete rmapVehicleMarkers[k]; }
  });
}

function drawGrid(v){
  const area = document.getElementById('gridarea');
  const active = new Set(activeServicesForDate(state.selectedDate));
  const trips = v.trips.filter(t => active.has(t.s));
  if(!trips.length){
    area.innerHTML = emptyHtml('bus','Erre a napra nincs induló járat','Válassz másik napot a menetrend megtekintéséhez.');
    reanimate(area);
    return;
  }
  const isToday = state.selectedDate === toYMD(new Date());
  const now = nowTimeStr();
  let nextCol = -1;
  if(isToday){
    for(let i=0;i<trips.length;i++){ if(trips[i].t[0] >= now){ nextCol = i; break; } }
  }
  let h = '<div class="gridwrap"><table class="tt"><thead><tr><th class="stopcol">Megálló</th>';
  trips.forEach((t,i)=> h += `<th class="${i===nextCol?'nextcell':''}">${t.t[0].slice(0,5)}</th>`);
  h += '</tr></thead><tbody>';
  v.stops.forEach((sid, si) => {
    h += `<tr><td class="stopname" data-sid="${sid}">${esc(STOPS[sid][0])}</td>`;
    trips.forEach((t,i)=>{
      const time = t.t[si];
      h += `<td class="${i===nextCol?'nextcell':''} ${time?'':'empty-cell'}">${time? time.slice(0,5) : '–'}</td>`;
    });

/* ---- stops map (Leaflet + estimated vehicle positions) ---- */
let STOPS_MAP = null, STOPS_MAP_VEHLAYER = null, STOPS_MAP_TIMER = null;
let stopMarkers = {}, vehicleMarkers = {};
function ensureLeaflet(cb, onerror){
  if(window.L){ cb(); return; }
  const existing = document.getElementById('leaflet-js');
  if(existing){ existing.addEventListener('load', cb); existing.addEventListener('error', onerror); return; }
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
  document.head.appendChild(link);
  const script = document.createElement('script');
  script.id = 'leaflet-js';
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  script.onload = cb;
  script.onerror = onerror;
  document.body.appendChild(script);
}
function timeToSec(t){ const p = t.split(':'); return (+p[0])*3600 + (+p[1])*60 + (+(p[2]||0)); }
function lerp(a,b,f){ return a + (b-a)*f; }
function computeVehiclePositions(){
  const now = nowTimeStr();
  const nowSec = timeToSec(now);
  const active = new Set(activeServicesForDate(toYMD(new Date())));
  const out = [];
  VARIANTS.forEach(v=>{
    v.trips.forEach((t, ti)=>{
      if(!active.has(t.s)) return;
      const first = t.t[0], last = t.t[t.t.length-1];
      if(now < first || now > last) return;
      let idx = t.t.length-1;
      for(let i=0;i<t.t.length-1;i++){ if(now >= t.t[i] && now < t.t[i+1]){ idx = i; break; } }
      const nextIdx = Math.min(idx+1, v.stops.length-1);
      const startSec = timeToSec(t.t[idx]), endSec = timeToSec(t.t[nextIdx]);
      const frac = endSec>startSec ? Math.min(1, Math.max(0, (nowSec-startSec)/(endSec-startSec))) : 0;
      let lat, lon;
      if(v.shapePts && v.stopDist){
        const d1 = v.stopDist[idx], d2 = v.stopDist[nextIdx];
        const targetDist = d1 + (d2-d1)*frac;
        const pos = pointAlongShape(v, targetDist);
        lat = pos[0]; lon = pos[1];
      }else{
        const s1 = STOPS[v.stops[idx]], s2 = STOPS[v.stops[nextIdx]];
        lat = lerp(s1[1], s2[1], frac); lon = lerp(s1[2], s2[2], frac);
      }
      out.push({
        key: v.id+'_'+ti, routeId: v.r, route: ROUTES[v.r][0], head: v.head,
        variantIndex: VARIANT_INDEX_IN_ROUTE[v.id] || 0,
        lat, lon,
        nextStop: STOPS[v.stops[nextIdx]][0], nextTime: t.t[nextIdx]
      });
    });
  });
  return out;
}
function initStopsMap(){
  ensureLeaflet(()=>{
    const container = document.getElementById('stopsMap');
    if(!container) return;
    const map = L.map('stopsMap', {zoomControl:true, attributionControl:true}).setView([46.3597,17.7963], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'© OpenStreetMap közreműködők'
    }).addTo(map);
    const stopLayer = L.layerGroup().addTo(map);
    stopMarkers = {};
    Object.keys(STOPS).forEach(sid=>{
      const s = STOPS[sid];
      const m = L.circleMarker([s[1], s[2]], {radius:7, color:'#2B6FD4', weight:2, fillColor:'#2B6FD4', fillOpacity:0.85}).addTo(stopLayer);
      m.bindPopup(`<div class="mappopup"><b>${esc(s[0])}</b><br><a href="#" data-popup-stop="${sid}">Megállólap megnyitása →</a></div>`);
      m.on('popupopen', (e)=>{
        const el = e.popup.getElement().querySelector('[data-popup-stop]');
        if(el) el.onclick = (ev)=>{ ev.preventDefault(); openStopDetail(sid); };
      });
      stopMarkers[sid] = m;
    });
    const vehLayer = L.layerGroup().addTo(map);
    STOPS_MAP = map; STOPS_MAP_VEHLAYER = vehLayer;
    const loadingRow = document.getElementById('mapLoadingRow');
    if(loadingRow) loadingRow.remove();
    refreshVehicleMarkers();
    STOPS_MAP_TIMER = setInterval(()=>{
      if(state.view !== 'stops'){ stopStopsMapRefresh(); return; }
      refreshVehicleMarkers();
    }, 15000);

    const locateBtn = document.getElementById('mapLocateBtn');
    if(locateBtn) locateBtn.onclick = ()=>{
      if(!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos=>{
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        L.circleMarker([pos.coords.latitude, pos.coords.longitude], {radius:6, color:'#1E9C93', fillColor:'#1E9C93', fillOpacity:0.9, weight:2}).addTo(map);
      });
    };
  }, ()=>{
    const wrap = document.getElementById('stopsMapWrap');
    if(wrap) wrap.innerHTML = emptyHtml('cloudOff','A térkép nem tölthető be','Ellenőrizd az internetkapcsolatot, és próbáld újra.');
  });
}
function refreshVehicleMarkers(){
  if(!STOPS_MAP_VEHLAYER) return;
  const positions = computeVehiclePositions();
  const seenKeys = new Set();
  positions.forEach(p=>{
    seenKeys.add(p.key);
    let marker = vehicleMarkers[p.key];
    if(marker){
      marker.setLatLng([p.lat, p.lon]);
    }else{
      const icon = L.divIcon({className:'', html:`<div class="vehiclepin">${esc(p.route)}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
      marker = L.marker([p.lat, p.lon], {icon}).addTo(STOPS_MAP_VEHLAYER);
      marker.on('popupopen', (e)=>{
        const el = e.popup.getElement().querySelector('[data-popup-open-route]');
        if(el) el.onclick = (ev)=>{ ev.preventDefault(); openRoute(marker._routeId, marker._variantIndex); };
      });
      vehicleMarkers[p.key] = marker;
    }
    marker._routeId = p.routeId;
    marker._variantIndex = p.variantIndex;
    marker.bindPopup(`<div class="mappopup"><b>${esc(p.route)}</b> → ${esc(p.head)}<br><span class="mp-sub">Becsült pozíció · köv. megálló: ${esc(p.nextStop)} (${esc(p.nextTime.slice(0,5))})</span><br><a href="#" data-popup-open-route="1">Menetrend megnyitása (ez az irány) →</a><br><span class="mp-note">${ICO.info} Ez nem élő adat, csak menetrendi információ. A hivatalos élő járatkövetés a Menüből érhető el.</span></div>`);
  });
  Object.keys(vehicleMarkers).forEach(k=>{
    if(!seenKeys.has(k)){ STOPS_MAP_VEHLAYER.removeLayer(vehicleMarkers[k]); delete vehicleMarkers[k]; }
  });
}
function stopStopsMapRefresh(){
  if(STOPS_MAP_TIMER){ clearInterval(STOPS_MAP_TIMER); STOPS_MAP_TIMER = null; }
}
function destroyStopsMap(){
  stopStopsMapRefresh();
  if(STOPS_MAP){ STOPS_MAP.remove(); STOPS_MAP = null; STOPS_MAP_VEHLAYER = null; }
  stopMarkers = {}; vehicleMarkers = {};
}

function drawDepartures(sid){
  const area = document.getElementById('deparea');
  const active = new Set(activeServicesForDate(state.selectedDate));
  const entries = VARIANTS_BY_STOP[sid] || [];
  let deps = [];
  entries.forEach(({v, idx})=>{
    v.trips.forEach(t=>{
      if(active.has(t.s) && t.t[idx]){
        deps.push({time: t.t[idx], routeId: v.r, route: ROUTES[v.r][0], head: v.head});
      }
    });
  });
  deps.sort((a,b)=> a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
  if(!deps.length){
    area.innerHTML = emptyHtml('bus','Erre a napra nincs induló járat','Válassz másik napot.');
    reanimate(area);
    return;
  }
  const isToday = state.selectedDate === toYMD(new Date());
  const now = nowTimeStr();
  let nextIdx = -1;
  if(isToday){
    for(let i=0;i<deps.length;i++){ if(deps[i].time >= now){ nextIdx = i; break; } }
  }
  let h = '';
  deps.forEach((d,i)=>{
    const past = isToday && d.time < now;
    const isNext = i === nextIdx;
    if(isNext) h += `<div class="nowline">Legközelebbi indulás</div>`;
    h += `<div class="dep ${past?'past':''} ${isNext?'next':''}">
      <div class="time">${d.time.slice(0,5)}</div>
      <div class="badge sm linkbadge" data-route="${d.routeId}">${esc(d.route)}</div>
      <div class="dd"><div class="dhead">→ ${esc(d.head)}</div></div>
    </div>`;
  });
  area.innerHTML = h;
  area.querySelectorAll('[data-route]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); openRoute(b.dataset.route); });
  reanimate(area);
  if(nextIdx>0){
    setTimeout(()=>{
      const nl = area.querySelector('.nowline');
      if(nl) nl.scrollIntoView({block:'start'});
    }, 30);
  }
}

/* ---- NEWS (RSS) ---- */
const NEWS_FEED_URL = 'https://politepol.com/fd/IszG7V3gplxS.xml';
const NEWS_FALLBACK_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(NEWS_FEED_URL);
let NEWS_CACHE = null;
function fmtNewsDate(d){ return d.getFullYear()+'. '+MO[d.getMonth()]+' '+d.getDate()+'.'; }
function cleanDesc(desc){
  let d = (desc||'').replace(/<[^>]*>/g,'');
  d = d.split(/\n\s*Delivered by/i)[0];
  return d.trim();
}
function parseRssXmlText(text){
  const xml = new DOMParser().parseFromString(text, 'application/xml');
  if(xml.querySelector('parsererror')) throw new Error('parse error');
  return Array.from(xml.querySelectorAll('item')).map(it=>({
    title: it.querySelector('title')?.textContent || '',
    link: it.querySelector('link')?.textContent || '',
    desc: cleanDesc(it.querySelector('description')?.textContent),
    date: new Date(it.querySelector('pubDate')?.textContent || Date.now())
  }));
}
async function fetchNewsItems(){
  try{
    const r = await fetch(NEWS_FEED_URL);
    if(r.ok){
      const items = parseRssXmlText(await r.text());
      if(items.length) return items;
    }
  }catch(e){ /* fall through */ }
  const r2 = await fetch(NEWS_FALLBACK_URL);
  if(!r2.ok) throw new Error('fallback failed');
  const data = await r2.json();
  if(data.status !== 'ok' || !Array.isArray(data.items)) throw new Error('bad fallback payload');
  return data.items.map(it=>({
    title: it.title || '',
    link: it.link || '',
    desc: cleanDesc(it.description || ''),
    date: new Date(it.pubDate || Date.now())
  }));
}
function renderNews(header, content){
  header.innerHTML = headerSimple('MissIt Kaposvár','Közlekedési információk · kaposbusz.hu');
  content.innerHTML = `<div class="card"><div class="loadingrow"><span class="spinner"></span>Hírek betöltése…</div></div>`;
  reanimate(content);

  if(NEWS_CACHE){ drawNews(content, NEWS_CACHE); return; }

  fetchNewsItems().then(items=>{
    NEWS_CACHE = items;
    drawNews(content, items);
  }).catch(()=>{
    content.innerHTML = emptyHtml('cloudOff','A hírek jelenleg nem tölthetők be','Ellenőrizd az internetkapcsolatot, vagy nézd meg a híreket közvetlenül a hivatalos oldalon.')
      .replace('</div>', `<a class="maplink" style="justify-content:center;width:100%;" href="https://www.kaposbusz.hu/hirek/" target="_blank" rel="noopener">Hírek megnyitása ${ICO.chevronRight}</a></div>`);
    reanimate(content);
  });
}
function drawNews(content, items){
  if(!items.length){
    content.innerHTML = emptyHtml('newspaper','Jelenleg nincs friss hír');
    reanimate(content);
    return;
  }
  let html = '<div class="card">';
  items.forEach(it=>{
    html += `<div class="newsitem">
      <div class="ndate">${esc(fmtNewsDate(it.date))}</div>
      <div class="ntitle">${esc(it.title)}</div>
      <div class="ndesc">${esc(it.desc)}</div>
      <a class="nlink" href="${it.link}" target="_blank" rel="noopener">Tovább olvasás →</a>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
  reanimate(content);
}

/* ---- KAPOSGO BLOG (RSS) ---- */
const BLOG_FEED_URL = 'https://kaposgo.blogspot.com/feeds/posts/default?alt=rss';
const BLOG_FALLBACK_URL = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(BLOG_FEED_URL);
let BLOG_CACHE = null;
function excerpt(text, max){
  text = (text||'').trim();
  return text.length > max ? text.slice(0, max).replace(/\s+\S*$/, '') + '…' : text;
}
async function fetchBlogItems(){
  try{
    const r = await fetch(BLOG_FEED_URL);
    if(r.ok){
      const items = parseRssXmlText(await r.text());
      if(items.length) return items.map(it=>({...it, desc: excerpt(it.desc, 220)}));
    }
  }catch(e){ /* fall through */ }
  const r2 = await fetch(BLOG_FALLBACK_URL);
  if(!r2.ok) throw new Error('fallback failed');
  const data = await r2.json();
  if(data.status !== 'ok' || !Array.isArray(data.items)) throw new Error('bad fallback payload');
  return data.items.map(it=>({
    title: it.title || '',
    link: it.link || '',
    desc: excerpt(cleanDesc(it.description || ''), 220),
    date: new Date(it.pubDate || Date.now())
  }));
}
function renderBlog(header, content){
  header.innerHTML = headerBack('KaposGO Blog','Beszámolók a helyi közlekedésről');
  document.getElementById('btn-back').onclick = goBack;
  content.innerHTML = `<div class="card"><div class="loadingrow"><span class="spinner"></span>Bejegyzések betöltése…</div></div>`;
  reanimate(content);

  if(BLOG_CACHE){ drawNews(content, BLOG_CACHE); return; }

  fetchBlogItems().then(items=>{
    BLOG_CACHE = items;
    drawNews(content, items);
  }).catch(()=>{
    content.innerHTML = emptyHtml('cloudOff','A blog jelenleg nem tölthető be','Ellenőrizd az internetkapcsolatot, vagy nyisd meg a blogot közvetlenül.')
      .replace('</div>', `<a class="maplink" style="justify-content:center;width:100%;" href="https://kaposgo.blogspot.com/" target="_blank" rel="noopener">Blog megnyitása ${ICO.chevronRight}</a></div>`);
    reanimate(content);
  });
}
